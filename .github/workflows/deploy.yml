name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build check (Docker images)
        run: |
          docker build -t web-check -f backend_service/Dockerfile backend_service/
          docker build -t chatbot-check -f chatbot_service/Dockerfile chatbot_service/

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/stay-rentals-backend/backend_service
            git pull origin main
            sudo docker compose up -d --build web celery_worker celery_beat